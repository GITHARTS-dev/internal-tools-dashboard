# Build and deploy to Azure Static Web Apps.
#
# The client and the API ship together from one commit, so a schema change and
# the UI that depends on it can never be live in different versions.
#
# Tests and the build run on every push regardless -- that is real CI, worth
# having before any Azure resource exists. The Deploy step itself is skipped,
# not failed, while AZURE_STATIC_WEB_APPS_API_TOKEN is unset (Repo -> Settings
# -> Secrets and variables -> Actions), which is the state until the Static
# Web App is created (see DEPLOYMENT.md). Adding that secret is the only
# change needed to turn deployment back on; nothing here needs editing again.

name: Deploy to Azure

on:
  push:
    branches: [azure-swa, main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    # `secrets` cannot be read in an `if:` -- GitHub rejects the whole file as
    # invalid, so every run fails before a single job starts. Copied into env
    # here, it can be tested as `env.SWA_TOKEN` instead.
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Not 20: vitest 5 requires Node 22 or later, so Test fails outright on 20.
          node-version: 22
          cache: npm

      - run: npm ci

      # Tests gate the deploy. The Postgres suite runs here too: PGlite is a
      # real Postgres in WASM, so no service container is needed.
      - name: Test
        run: npm test

      - name: Build client and API
        env:
          # Baked into the built JS bundle, not secret -- the client ID and
          # tenant ID are public identifiers, the same as any request MSAL
          # makes already reveals them. Repo -> Settings -> Secrets and
          # variables -> Actions -> Variables tab (not Secrets).
          VITE_AAD_CLIENT_ID: ${{ vars.AAD_CLIENT_ID }}
          VITE_AAD_TENANT_ID: ${{ vars.AAD_TENANT_ID }}
        run: npm run build:azure

      - name: No Static Web App yet, skipping deploy
        if: env.SWA_TOKEN == ''
        run: echo "AZURE_STATIC_WEB_APPS_API_TOKEN is not set -- tests and the build passed, deploy skipped. See DEPLOYMENT.md."

      - name: Deploy
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist/client
          api_location: api
          output_location: ''
          skip_app_build: true

  close-pr:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close preview environment
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: close
